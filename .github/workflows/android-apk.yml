name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-contracts:
    name: Backend contracts and project validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stayeasy_test
          POSTGRES_USER: stayeasy
          POSTGRES_PASSWORD: stayeasy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stayeasy -d stayeasy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install API and test dependencies
        run: python -m pip install -r backend/requirements.txt pytest

      - name: Run API contract tests
        run: python -m pytest backend/tests -q

      - name: Validate Alembic migration on a clean database
        env:
          DATABASE_URL: sqlite:////tmp/stayeasy_alembic_test.db
        run: |
          rm -f /tmp/stayeasy_alembic_test.db
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini current

      - name: Validate project layout and feature contracts
        run: python tools/validate_project.py

      - name: Verify PostgreSQL reservation concurrency
        env:
          DATABASE_URL: postgresql+psycopg://stayeasy:stayeasy@localhost:5432/stayeasy_test
          APP_ENV: test
          JWT_SECRET: postgres-reservation-race-test-secret-at-least-32-chars
          DEV_TOKEN_PASSWORD: local-only-postgres-test-password
        run: python -m pytest backend/tests_postgres -q

  android-ui-tests:
    needs: backend-contracts
    name: Android emulator UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci/collect-android-screenshots.sh

      - name: Upload Android UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stayeasy-android-screenshots
          path: app/build/ui-screenshots/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stayeasy-android-ui-test-results
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 30

  build:
    needs: backend-contracts
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Build unsigned release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stayeasy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: stayeasy-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

  compose-seeded-e2e:
    needs: backend-contracts
    name: Docker Compose seeded API and rent-charge smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure disposable local-only test secrets
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=stayeasy
          POSTGRES_USER=stayeasy
          POSTGRES_PASSWORD=ci-local-postgres-password
          APP_ENV=development
          JWT_SECRET=ci-only-secret-not-for-deployment-0123456789abcdef
          JWT_ISSUER=stayeasy-api
          ACCESS_TOKEN_MINUTES=120
          DEV_TOKEN_PASSWORD=ci-dev-token-password
          API_PORT=8000
          API_BIND_HOST=127.0.0.1
          SEED_DEMO_DATA=true
          CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080
          RAZORPAY_KEY_ID=
          RAZORPAY_KEY_SECRET=
          RAZORPAY_WEBHOOK_SECRET=
          PROPERTY_FEED_URL=
          PROPERTY_FEED_SOURCE=partner-feed
          PROPERTY_FEED_TOKEN=
          PROPERTY_FEED_POLL_SECONDS=300
          EOF

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Start PostgreSQL and migrated API
        run: docker compose up --build -d

      - name: Verify health, seeded listings and unpaid tenant charge
        env:
          DEV_TOKEN_PASSWORD: ci-dev-token-password
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/stayeasy-health.json; then break; fi
            sleep 2
          done
          python -c 'import json; d=json.load(open("/tmp/stayeasy-health.json")); assert d["status"] == "ok", d; print("API health:", d)'
          curl --fail --silent 'http://127.0.0.1:8000/properties?city=Pune' > /tmp/stayeasy-listings.json
          python -c 'import json; d=json.load(open("/tmp/stayeasy-listings.json")); items=d["items"]; assert len(items) >= 3, d; assert all(p.get("data_source") == "demo-fixture" for p in items), items; print("Seeded listing rows:", len(items))'
          TENANT_TOKEN=$(curl --fail --silent -X POST http://127.0.0.1:8000/auth/dev-token -H 'Content-Type: application/json' -d "{\"subject\":\"stayeasy-demo-tenant\",\"role\":\"customer\",\"dev_password\":\"$DEV_TOKEN_PASSWORD\"}" | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl --fail --silent http://127.0.0.1:8000/payments/charges -H "Authorization: Bearer $TENANT_TOKEN" > /tmp/stayeasy-charges.json
          python -c 'import json; d=json.load(open("/tmp/stayeasy-charges.json")); charges=d["charges"]; assert len(charges) >= 1, d; assert charges[0]["amount_due_paise"] > 0, charges[0]; print("Tenant payable charges:", len(charges), "first due paise:", charges[0]["amount_due_paise"])'

      - name: Print container logs if the stack failed
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop and remove disposable stack
        if: always()
        run: docker compose down -v
